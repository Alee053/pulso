spring:
  application:
    name: pulso-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
          audiences:
            - ${SUPABASE_JWT_AUDIENCE:authenticated}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

pulso:
  security:
    supabase:
      issuer: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
      jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:}
      secret: ${SUPABASE_JWT_SECRET:}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
