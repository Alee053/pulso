logging:
  level:
    com.pulso.backend.ops.logging.ApplicationLogger: ${PULSO_LOG_LEVEL:INFO}

spring:
  application:
    name: pulso-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  mail:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:${PULSO_SMTP_PORT:54325}}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      properties:
        "[mail.smtp.auth]": ${SMTP_AUTH:false}
        "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
        "[mail.smtp.connectiontimeout]": 5000
        "[mail.smtp.timeout]": 5000
        "[mail.smtp.writetimeout]": 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
          audiences:
            - ${SUPABASE_JWT_AUDIENCE:authenticated}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

pulso:
  security:
    supabase:
      issuer: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
      jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:}
      secret: ${SUPABASE_JWT_SECRET:}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  discovery:
    default-offset: ${PULSO_DISCOVERY_DEFAULT_OFFSET:0}
    default-limit: ${PULSO_DISCOVERY_DEFAULT_LIMIT:20}
    max-limit: ${PULSO_DISCOVERY_MAX_LIMIT:50}
    max-offset: ${PULSO_DISCOVERY_MAX_OFFSET:100000}
  current-projects:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000
  project-memberships:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000
  catalogs:
    max-items-per-catalog: ${PULSO_CATALOGS_MAX_ITEMS_PER_CATALOG:500}
  preferences:
    max-items-per-field: ${PULSO_PREFERENCES_MAX_ITEMS_PER_FIELD:10}
    max-token-length: ${PULSO_PREFERENCES_MAX_TOKEN_LENGTH:40}
    sector-id-max-length: ${PULSO_PREFERENCES_SECTOR_ID_MAX_LENGTH:120}
  profile:
    display-name-max-length: ${PULSO_PROFILE_DISPLAY_NAME_MAX_LENGTH:120}
    avatar-path-max-length: ${PULSO_PROFILE_AVATAR_PATH_MAX_LENGTH:500}
    short-bio-max-length: ${PULSO_PROFILE_SHORT_BIO_MAX_LENGTH:500}
    city-max-length: ${PULSO_PROFILE_CITY_MAX_LENGTH:120}
    department-max-length: ${PULSO_PROFILE_DEPARTMENT_MAX_LENGTH:120}
  project:
    slug-min-length: ${PULSO_PROJECT_SLUG_MIN_LENGTH:2}
    slug-max-length: ${PULSO_PROJECT_SLUG_MAX_LENGTH:120}
    name-max-length: ${PULSO_PROJECT_NAME_MAX_LENGTH:160}
    tagline-max-length: ${PULSO_PROJECT_TAGLINE_MAX_LENGTH:240}
    description-max-length: ${PULSO_PROJECT_DESCRIPTION_MAX_LENGTH:5000}
    city-max-length: ${PULSO_PROJECT_CITY_MAX_LENGTH:120}
    stage-token-max-length: ${PULSO_PROJECT_STAGE_TOKEN_MAX_LENGTH:40}
    invitee-email-max-length: ${PULSO_PROJECT_INVITEE_EMAIL_MAX_LENGTH:254}

  invitation:
    frontend-url: ${PULSO_INVITATION_FRONTEND_URL:http://localhost:4200}
    from: ${PULSO_INVITATION_FROM:no-reply@pulso.local}
