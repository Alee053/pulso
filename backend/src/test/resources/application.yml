spring:
  application:
    name: pulso-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
          audiences:
            - ${SUPABASE_JWT_AUDIENCE:authenticated}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

pulso:
  security:
    supabase:
      issuer: http://test.supabase.local/auth/v1
      jwk-set-uri:
      secret: test-secret-that-is-long-enough-for-local-tests
      audience: authenticated

  cors:
    allowed-origins: http://localhost:4200

  discovery:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000
  project-members:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000
  current-projects:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000
  project-opportunities:
    default-offset: 0
    default-limit: 20
    max-limit: 50
    max-offset: 100000

  catalogs:
    max-items-per-catalog: 500

  preferences:
    max-items-per-field: 10
    max-token-length: 40
    sector-id-max-length: 120

  profile:
    display-name-max-length: 120
    avatar-path-max-length: 500
    short-bio-max-length: 500
    city-max-length: 120
    department-max-length: 120

  project:
    slug-min-length: 2
    slug-max-length: 120
    name-max-length: 160
    tagline-max-length: 240
    description-max-length: 5000
    city-max-length: 120
    stage-token-max-length: 40
    invitee-email-max-length: 254

  invitation:
    frontend-url: ${PULSO_FRONTEND_URL:http://localhost:4200}
    from: ${PULSO_INVITATION_FROM:invitations@localhost}
