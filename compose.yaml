name: pulso

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.166
    restart: unless-stopped
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      - "${PULSO_POSTGRES_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/supabase/init/00-pulso-foundation.sh:/docker-entrypoint-initdb.d/zz-pulso-foundation.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres && psql -U supabase_admin -d postgres -Atc \"select 1 from pg_roles where rolname = 'supabase_auth_admin'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    restart: unless-stopped
    ports:
      - "${PULSO_MAILPIT_PORT:-54324}:8025"
      - "${PULSO_SMTP_PORT:-54325}:1025"

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.195.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["auth"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:54321/auth/v1}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:4200}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-http://localhost:4200,http://127.0.0.1:4200}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://127.0.0.1:54321/auth/v1}
      GOTRUE_JWT_VALIDMETHODS: HS256
      GOTRUE_JWT_VALID_METHODS: HS256
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@pulso.local
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: Pulso local
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 6
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrator:
    image: public.ecr.aws/supabase/postgres:17.6.1.166
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["sh /runner/migrate.sh"]
    volumes:
      - ./database/supabase/migrations:/runner/migrations:ro
      - ./database/supabase/seed.sql:/runner/seed.sql:ro
      - ./docker/supabase/migrate.sh:/runner/migrate.sh:ro

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.5
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      PGRST_ADMIN_SERVER_PORT: 3001

  realtime:
    image: public.ecr.aws/supabase/realtime:v2.112.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "-s", "-g", "--", "/app/run.sh"]
    command: ["/app/bin/server"]
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      METRICS_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      APP_NAME: realtime
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:-pulso-local-realtime-secret-key-base-change-me-64-characters-1234567890}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: ""
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      MAX_HEADER_LENGTH: 4096

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.71.0
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwdWxzby1sb2NhbCIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6NDEwMjQ0NDgwMCwicm9sZSI6ImFub24ifQ.PqWUWLgW1nslM2tLRe4bO8UVpasf9PyfdEH-Ntt3DaA}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwdWxzby1sb2NhbCIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6NDEwMjQ0NDgwMCwicm9sZSI6InNlcnZpY2Vfcm9sZSJ9.9Bdk3RIrsS3nJzlTjGknh7xN4Ze_tla9es7dmDEZNio}
      AUTH_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      STORAGE_S3_REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      TUS_URL_PATH: /storage/v1/upload/resumable
      S3_PROTOCOL_ENABLED: "true"
      S3_PROTOCOL_ACCESS_KEY_ID: pulso-local
      S3_PROTOCOL_ACCESS_KEY_SECRET: pulso-local-storage-secret
      S3_PROTOCOL_PREFIX: /storage/v1
      UPLOAD_FILE_SIZE_LIMIT: 52428800000
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: 5242880000
      SIGNED_UPLOAD_URL_EXPIRATION_TIME: 7200
      VECTOR_ENABLED: "false"
    volumes:
      - storage-data:/var/lib/storage

  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  studio:
    image: public.ecr.aws/supabase/studio:2026.07.06-sha-66cf431
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
      rest:
        condition: service_started
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: Pulso local
      DEFAULT_PROJECT_NAME: Pulso
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwdWxzby1sb2NhbCIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6NDEwMjQ0NDgwMCwicm9sZSI6ImFub24ifQ.PqWUWLgW1nslM2tLRe4bO8UVpasf9PyfdEH-Ntt3DaA}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwdWxzby1sb2NhbCIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6NDEwMjQ0NDgwMCwicm9sZSI6InNlcnZpY2Vfcm9sZSJ9.9Bdk3RIrsS3nJzlTjGknh7xN4Ze_tla9es7dmDEZNio}
      AUTH_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      LOGFLARE_URL: http://localhost:4000
      PGRST_JWT_SECRET: ${JWT_SECRET:-pulso-local-jwt-secret-change-me-32-chars}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${PULSO_STUDIO_PORT:-54323}:3000"

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJwdWxzby1sb2NhbCIsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6NDEwMjQ0NDgwMCwicm9sZSI6ImFub24ifQ.PqWUWLgW1nslM2tLRe4bO8UVpasf9PyfdEH-Ntt3DaA}
    command:
      - /bin/sh
      - -ec
      - |
        envsubst '$$ANON_KEY' < /etc/nginx/pulso-gateway.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./docker/supabase/gateway.conf.template:/etc/nginx/pulso-gateway.conf.template:ro
    ports:
      - "${PULSO_SUPABASE_API_PORT:-54321}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
    name: ${PULSO_DB_VOLUME:-pulso-db-data}
  storage-data:
    name: ${PULSO_STORAGE_VOLUME:-pulso-storage-data}
