<main class="entry-page">
  <header class="entry-header">
    <div class="flex min-w-0 items-center gap-4">
      <pulso-brand-mark />
      <span class="entry-community">{{ strings.pageKicker }}</span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <pulso-language-switcher *ngIf="featureFlags.isEnabled('language_switcher')" />
      <pulso-theme-switcher />
    </div>
  </header>

  <div class="entry-spread">
    <section class="entry-cover" aria-labelledby="auth-page-title">
      <img class="entry-cover__image" src="assets/pulso-la-paz.webp" alt="" fetchpriority="high" />
      <div class="entry-cover__caption">
        <p class="entry-location"><pulso-icon name="map-pin" [size]="17" />{{ strings.location }}</p>
        <h1 id="auth-page-title">{{ strings.pageTitle }}</h1>
        <p>{{ strings.pageLead }}</p>
      </div>
    </section>

    <div class="entry-access">
      <pulso-auth-panel />
    </div>
  </div>
</main>
