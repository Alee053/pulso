<main class="page stacked-view">
  <header class="page-header">
    <h1 class="page-title">{{ strings.acceptTitle }}</h1>
    <p class="page-lead">{{ strings.acceptLead }}</p>
  </header>
  <section class="panel p-5 sm:p-8" [attr.aria-busy]="submitting()">
    <p *ngIf="accepted()" class="status-message" role="status">{{ strings.accepted }}</p>
    <ng-container *ngIf="!accepted()">
      <p *ngIf="!link.hasToken" class="status-message status-message--error" role="alert">{{ strings.invalid }}</p>
      <ng-container *ngIf="link.hasToken">
        <pulso-auth-panel *ngIf="!auth.session()" />
        <ng-container *ngIf="auth.session()">
          <button *ngIf="!failure()" type="button" class="solid-button w-full sm:w-auto" data-action="accept" [disabled]="submitting() || switchingAccount()" (click)="accept()">
            {{ submitting() ? strings.accepting : strings.accept }}
          </button>
          <div *ngIf="failure() as error" class="status-message status-message--error" role="alert">
            <p>{{ error.message }}</p>
            <button *ngIf="error.retryable" type="button" class="solid-button mt-4" data-action="accept" [disabled]="submitting() || switchingAccount()" (click)="accept()">{{ strings.retry }}</button>
          </div>
          <button type="button" class="contact-button mt-4 w-full sm:w-auto" [disabled]="submitting() || switchingAccount()" (click)="changeAccount()">{{ strings.changeAccount }}</button>
          <p *ngIf="signOutError() as error" class="field-error mt-3" role="alert">{{ error }}</p>
        </ng-container>
      </ng-container>
    </ng-container>
    <button type="button" class="contact-button mt-5 w-full sm:w-auto" [disabled]="submitting() || switchingAccount()" (click)="link.dismiss()">{{ strings.continue }}</button>
  </section>
</main>
