<section class="panel mx-auto max-w-xl p-6 sm:p-8" [attr.aria-busy]="busy()">
  <h1 class="page-title">{{ strings.acceptTitle }}</h1>
  <p class="page-lead">{{ strings.acceptLead }}</p>
  <button *ngIf="!projectId()" type="button" (click)="accept()" [disabled]="busy()" class="solid-button mt-5">{{ busy() ? strings.accepting : strings.accept }}</button>
  <p *ngIf="projectId()" role="status" class="status-message status-message--success mt-4">{{ strings.accepted }}</p>
  <p *ngIf="error()" role="alert" class="status-message status-message--error mt-4">{{ error() }}</p>
</section>
