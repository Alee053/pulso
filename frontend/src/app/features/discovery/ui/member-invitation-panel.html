<section class="panel p-5 sm:p-7" [attr.aria-busy]="busy()">
  <h2 class="text-xl font-semibold">{{ strings.inviteTitle }}</h2>
  <p id="draft-invite-hint" class="field-hint mt-1">{{ strings.emailHint }}</p>
  <form class="mt-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="invite-email" class="field-label">{{ strings.emailLabel }}</label>
    <div class="mt-1 flex flex-wrap items-start gap-2">
      <input id="invite-email" type="email" formControlName="email" autocomplete="email" required maxlength="254"
             class="field-input min-w-0 flex-1 basis-52" [readOnly]="busy()"
             [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid || null"
             [attr.aria-describedby]="form.controls.email.touched && form.controls.email.invalid ? 'draft-invite-hint draft-invite-error' : 'draft-invite-hint'" />
      <button type="submit" [disabled]="busy()" class="solid-button">{{ busy() ? strings.inviting : strings.invite }}</button>
    </div>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p id="draft-invite-error" role="alert" class="field-error mt-2">{{ strings.emailInvalid }}</p>
    }
  </form>
  <p *ngIf="success()" role="status" class="status-message status-message--success mt-3">{{ success() }}</p>
  <p *ngIf="error()" role="alert" class="status-message status-message--error mt-3">{{ error() }}</p>
</section>
