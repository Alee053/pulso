<aside class="desktop-nav" [attr.aria-label]="strings.aria">
  <div class="desktop-nav__brand">
    <pulso-brand-mark />
  </div>

  <div class="desktop-nav__section">
    <p class="desktop-nav__eyebrow">{{ strings.menuLabel }}</p>
    <nav class="desktop-nav__menu" [attr.aria-label]="strings.aria">
      <button
        *ngFor="let item of navigationItems"
        type="button"
        class="desktop-nav__item"
        [class.desktop-nav__item--active]="item.id === activeView"
        [attr.aria-current]="item.id === activeView ? 'page' : null"
        (click)="navigated.emit(item.id)"
      >
        <span class="desktop-nav__item-icon">
          <pulso-icon [name]="item.icon" [size]="18" [strokeWidth]="item.id === activeView ? 2 : 1.7" />
        </span>
        <span>{{ item.label }}</span>
        <span *ngIf="countFor(item) > 0" class="desktop-nav__count">{{ countFor(item) }}</span>
      </button>
    </nav>
  </div>

  <div class="desktop-nav__session">
    <span class="desktop-nav__session-icon">
      <pulso-icon name="sparkles" [size]="16" [strokeWidth]="1.7" />
    </span>
    <div class="min-w-0">
      <p class="desktop-nav__eyebrow">{{ strings.sessionEyebrow }}</p>
      <p class="mt-1 text-sm text-[var(--color-muted)]">{{ strings.savedSignals(totalSaved) }}</p>
    </div>
  </div>
</aside>

<header class="mobile-topbar">
  <pulso-brand-mark />
  <button type="button" class="reference-example" (click)="exampleRequested.emit()" [attr.aria-label]="common.exampleProject">
    <pulso-icon name="arrow-up-right" [size]="18" />
    <span>{{ strings.exampleShortLabel }}</span>
  </button>
</header>

<nav class="mobile-nav" [attr.aria-label]="strings.aria">
  <button
    *ngFor="let item of navigationItems"
    type="button"
    class="mobile-nav__item"
    [class.mobile-nav__item--active]="item.id === activeView"
    [attr.aria-current]="item.id === activeView ? 'page' : null"
    (click)="navigated.emit(item.id)"
  >
    <span class="relative">
      <pulso-icon [name]="item.icon" [size]="18" [strokeWidth]="item.id === activeView ? 2 : 1.7" />
      <span *ngIf="countFor(item) > 0" class="mobile-nav__count">{{ countFor(item) }}</span>
    </span>
    <span>{{ item.label }}</span>
  </button>
</nav>
