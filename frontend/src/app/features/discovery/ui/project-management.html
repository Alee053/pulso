<section class="mt-5 border-t border-[var(--color-border)] pt-5" [attr.aria-labelledby]="'project-management-' + project.projectId">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h3 class="text-lg font-semibold" [id]="'project-management-' + project.projectId">{{ strings.heading }}</h3>
      <p *ngIf="statusLabel()" class="field-hint">{{ statusLabel() }}</p>
    </div>
    <button *ngIf="!isEditing()" type="button" class="contact-button" data-action="edit-project"
            (click)="beginEdit()" [disabled]="actionBusy()">
      {{ strings.edit }}
    </button>
  </div>

  <form *ngIf="isEditing()" class="panel mt-4 grid gap-4 p-4 sm:grid-cols-2" [formGroup]="form"
        (ngSubmit)="save()" [attr.aria-busy]="saving()">
    <div>
      <label class="field-label" [for]="'project-name-' + project.projectId">{{ strings.name }}</label>
      <input class="field-input" [id]="'project-name-' + project.projectId" formControlName="name" maxlength="160"
             [attr.aria-invalid]="fieldError('name', 'required') ? 'true' : null" />
      <p *ngIf="fieldError('name', 'required')" class="field-error" role="alert">{{ strings.nameRequired }}</p>
    </div>
    <div>
      <label class="field-label" [for]="'project-tagline-' + project.projectId">{{ strings.tagline }}</label>
      <input class="field-input" [id]="'project-tagline-' + project.projectId" formControlName="tagline" maxlength="240"
             [attr.aria-invalid]="fieldError('tagline', 'required') ? 'true' : null" />
      <p *ngIf="fieldError('tagline', 'required')" class="field-error" role="alert">{{ strings.taglineRequired }}</p>
    </div>
    <div>
      <label class="field-label" [for]="'project-stage-' + project.projectId">{{ strings.stage }}</label>
      <select class="field-input" [id]="'project-stage-' + project.projectId" formControlName="stage">
        <option *ngFor="let option of stages" [value]="option.value">{{ option.label }}</option>
      </select>
    </div>
    <div>
      <label class="field-label" [for]="'project-sector-' + project.projectId">{{ strings.sector }}</label>
      <select class="field-input" [id]="'project-sector-' + project.projectId" formControlName="sectorId"
              [attr.aria-invalid]="fieldError('sectorId', 'required') || fieldError('sectorId', 'unavailable') ? 'true' : null">
        <option value="">{{ strings.chooseSector }}</option>
        <option *ngIf="!hasCurrentSector()" [value]="project.sectorId">{{ strings.inactiveSector(project.sectorName) }}</option>
        <option *ngFor="let sector of sectors" [value]="sector.id">{{ sector.name }}</option>
      </select>
      <p *ngIf="fieldError('sectorId', 'required')" class="field-error" role="alert">{{ strings.sectorRequired }}</p>
      <p *ngIf="fieldError('sectorId', 'unavailable')" class="field-error" role="alert">{{ strings.sectorUnavailable }}</p>
    </div>
    <div>
      <label class="field-label" [for]="'project-city-' + project.projectId">{{ strings.city }}</label>
      <input class="field-input" [id]="'project-city-' + project.projectId" formControlName="city" maxlength="120"
             [attr.aria-invalid]="fieldError('city', 'required') ? 'true' : null" />
      <p *ngIf="fieldError('city', 'required')" class="field-error" role="alert">{{ strings.cityRequired }}</p>
    </div>
    <div>
      <label class="field-label" [for]="'project-department-' + project.projectId">{{ strings.department }}</label>
      <input class="field-input" [id]="'project-department-' + project.projectId" formControlName="department" maxlength="120" />
    </div>
    <div class="sm:col-span-2">
      <label class="field-label" [for]="'project-description-' + project.projectId">{{ strings.description }}</label>
      <textarea class="field-input" [id]="'project-description-' + project.projectId" formControlName="description" maxlength="5000"></textarea>
    </div>
    <div class="sm:col-span-2">
      <label class="field-label" [for]="'project-value-' + project.projectId">{{ strings.valueProposition }}</label>
      <textarea class="field-input" [id]="'project-value-' + project.projectId" formControlName="valueProposition" maxlength="5000"></textarea>
    </div>
    <div class="flex flex-wrap gap-2 sm:col-span-2">
      <button type="button" class="contact-button" (click)="cancelEdit()" [disabled]="saving()">{{ strings.cancel }}</button>
      <button type="submit" class="solid-button" [disabled]="saving() || form.invalid">
        {{ saving() ? strings.saving : strings.save }}
      </button>
    </div>
  </form>

  <p *ngIf="error() as message" class="status-message status-message--error mt-4" role="alert">{{ message }}</p>
  <p *ngIf="success() as message" class="status-message status-message--success mt-4" role="status" aria-live="polite">{{ message }}</p>

  <div class="mt-4 flex flex-wrap gap-2">
    <button *ngIf="project.status === 'DRAFT'" type="button" class="solid-button" data-action="request-publication"
            (click)="requestPublication()" [disabled]="actionBusy() || isEditing()">
      {{ strings.requestPublication }}
    </button>
    <button *ngIf="canArchive()" type="button" class="contact-button" data-action="archive-project"
            (click)="archive()" [disabled]="actionBusy() || isEditing()">
      {{ strings.archive }}
    </button>
    <p *ngIf="actionBusy()" class="field-hint" role="status">{{ strings.saving }}</p>
  </div>
</section>
