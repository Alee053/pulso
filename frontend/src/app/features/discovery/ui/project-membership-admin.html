<section *ngIf="canManage()" class="mt-6 border-t border-white/10 pt-5">
  <button type="button" class="contact-button" [attr.aria-expanded]="expanded()"
    (click)="toggle()">
    {{ expanded() ? strings.hideMembers : strings.manageMembers }}
  </button>

  <div *ngIf="expanded()" class="mt-5 space-y-4" [attr.data-membership-project]="project().projectId">
    <div class="flex flex-wrap gap-3">
      <button type="button" class="contact-button" (click)="refresh()" [disabled]="loading()">
        {{ strings.refreshMembers }}
      </button>
    </div>

    <p *ngIf="loading()" class="field-hint" role="status">{{ strings.membersLoading }}</p>
    <div *ngIf="errorMessage() as error" class="status-message status-message--error" role="alert">
      <p>{{ error }}</p>
      <button type="button" class="solid-button mt-4" (click)="load(true)" [disabled]="loading()">
        {{ strings.retry }}
      </button>
    </div>
    <p *ngIf="!loading() && !errorMessage() && members().length === 0"
      class="field-hint" role="status">{{ strings.membersEmpty }}</p>

    <ul *ngIf="members().length > 0" class="space-y-3" aria-label="Integrantes del equipo">
      <li *ngFor="let member of members(); trackBy: trackMember"
        class="panel flex flex-col gap-4 p-4 sm:flex-row sm:items-center sm:justify-between"
        [attr.data-membership-id]="member.id">
        <div class="min-w-0">
          <p class="break-words font-semibold">{{ memberLabel(member) }}</p>
          <p class="field-hint mt-1">
            {{ roleLabels[member.role] }} · {{ strings.status[member.membershipStatus] }}
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <ng-container *ngIf="member.membershipStatus === 'ACTIVE'">
            <label class="sr-only" [for]="'membership-role-' + member.id">
              {{ strings.changeRoleFor }} {{ memberLabel(member) }}
            </label>
            <select [id]="'membership-role-' + member.id"
              class="field-input mt-0 w-full sm:w-auto"
              [value]="selectedRole(member)" (change)="setRole(member, $event)">
              <option *ngFor="let role of availableRoles(member)" [value]="role">
                {{ roleLabels[role] }}
              </option>
            </select>
            <button type="button" class="solid-button" (click)="updateRole(member)"
              [disabled]="busyMemberId() === member.id || selectedRole(member) === member.role">
              {{ busyMemberId() === member.id ? strings.saving : strings.saveRole }}
            </button>
          </ng-container>

          <button *ngIf="(member.membershipStatus === 'LEFT' || member.membershipStatus === 'REMOVED')
            && member.profileId"
            type="button" class="solid-button" (click)="activate(member)"
            [disabled]="busyMemberId() === member.id">
            {{ busyMemberId() === member.id ? strings.saving : strings.activateMember }}
          </button>
          <button *ngIf="(member.membershipStatus === 'INVITED' || member.membershipStatus === 'ACTIVE')
            && member.profileId !== actorProfileId()"
            type="button" class="contact-button" (click)="withdraw(member)"
            [disabled]="busyMemberId() === member.id">
            {{ busyMemberId() === member.id ? strings.saving : strings.withdrawMember }}
          </button>
        </div>
      </li>
    </ul>

    <button *ngIf="hasMore() && !errorMessage()" type="button" class="contact-button"
      (click)="load()" [disabled]="loading()">
      {{ strings.loadMoreMembers }}
    </button>
    <p *ngIf="busyMemberId()" class="field-hint" role="status">{{ strings.saving }}</p>
  </div>
</section>
