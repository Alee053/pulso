<section [attr.role]="loadedProject ? null : 'dialog'" [attr.aria-modal]="loadedProject ? null : 'true'" aria-label="Detalle público del proyecto">
<!-- Estado: Cargando -->
<div *ngIf="isLoading" class="loading-state" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p>Cargando proyecto...</p>
    <button type="button" (click)="close()">Volver</button>
</div>

<!-- Estado: No disponible -->
<div *ngIf="isEmpty" class="empty-state" role="status">
    <span class="empty-icon">📭</span>
    <h2>Proyecto no disponible</h2>
    <p>Este proyecto no está publicado o fue removido.</p>
    <button type="button" (click)="close()">Volver</button>
</div>

<!-- Estado: Error -->
<div *ngIf="hasError" class="error-state" role="alert">
    <span class="error-icon">⚠️</span>
    <h2>No se pudo cargar el proyecto</h2>
    <p>{{ errorMessage }}</p>
    <div class="error-actions">
        <button *ngIf="isRetryable" type="button" (click)="retry()">Reintentar</button>
        <button type="button" (click)="close()">Volver</button>
    </div>
</div>

<!-- Estado: Cargado -->
<pulso-startup-detail-modal *ngIf="loadedProject as project"
                            [startup]="mapToStartup(project)"
                            [recommendation]="recommendation"
                            [manageFocus]="false"
                            (closed)="close()" />
</section>
