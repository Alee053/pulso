<button
  type="button"
  class="share-button"
  [disabled]="isSharing()"
  (pointerdown)="$event.stopPropagation()"
  (click)="share($event)"
  [attr.aria-label]="'Compartir ' + projectName"
>
  <pulso-icon name="share" [size]="18" />
  <span *ngIf="feedback() as msg" class="share-feedback" role="status">{{ msg }}</span>
</button>
