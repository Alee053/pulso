<article class="discovery-card" [class.discovery-card--dragging]="isDragging" [style.transform]="cardTransform"
          (click)="onCardClick($event)" tabindex="-1" [attr.aria-label]="strings.openAria(startup.name)">
    <div class="discovery-card__cover" (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
         (pointercancel)="onPointerCancel($event)">
        @if (startup.image && failedImage !== startup.image) {
            <img [src]="startup.image" [alt]="startup.imageAlt" class="discovery-card__image" draggable="false" (error)="failedImage = startup.image" />
        } @else {
            <span class="cover-monogram" aria-hidden="true">{{ startup.logoMark }}</span>
        }
        <span class="project-stage" *ngIf="stageLabel">{{ stageLabel }}</span>
        <div class="discovery-card__identity">
            <p class="discovery-card__metadata">
                <span>{{ startup.sector }}</span>
                @if (startup.city) { <span><pulso-icon name="map-pin" [size]="14" />{{ startup.city }}</span> }
            </p>
            <h2>{{ startup.name }}</h2>
        </div>
    </div>
    <div class="discovery-card__content">
        <p class="discovery-card__pitch">{{ startup.pitch }}</p>
        <div class="discovery-card__links">
            <button type="button" class="discovery-card__profile-link" [disabled]="disabled"
                    (pointerdown)="$event.stopPropagation()" (click)="selectFromButton($event)">
                {{ strings.openProfile }} <pulso-icon name="arrow-up-right" [size]="16" />
            </button>
            <pulso-share-button [projectRef]="startup.id" [projectName]="startup.name" origin="FEED" />
        </div>
    </div>
</article>
